name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Runs datagen (models, recipes, language files) so the jar always has up-to-date data
      - name: Generate data
        run: ./gradlew runData

      - name: Build with Gradle
        run: ./gradlew build

      # Fails if someone changed a data provider but forgot to run runData and commit src/generated
      - name: Check generated files are committed
        run: |
          git add -N src/generated
          if ! git diff --quiet -- src/generated; then
            echo "Datagen output differs from the committed files. Run the runData task and commit src/generated."
            git diff --stat -- src/generated
            echo "----- BEGIN GENERATED (tar.gz base64) -----"
            tar czf - --exclude=.cache src/generated/resources | base64 -w 0
            echo
            echo "----- END GENERATED -----"
            exit 1
          fi