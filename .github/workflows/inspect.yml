name: Show Minecraft source

# Run by hand (Actions tab → "Show Minecraft source" → Run workflow) to print Minecraft/NeoForge
# source files in the log, e.g. "net/minecraft/world/level/biome/Biome.java".
# Handy because tutorials are for older versions and 26.x renamed a lot.
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Classes (net/minecraft/.../X.java) or resource files (assets/minecraft/...json) to print, separated by spaces'
        required: true
      grep:
        description: 'Optional: instead of whole files, only show lines matching this pattern (grep -n -E)'
        required: false
        default: ''
      javap_flags:
        description: 'javap options, e.g. "-p" (methods) or "-p -c" (with bytecode, to see what a method does)'
        required: false
        default: '-p'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Minecraft (decompiled sources)
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava
          # ModDevGradle task that also writes the decompiled Minecraft sources (normally done by the IDE sync)
          ./gradlew createMinecraftArtifacts -Pneoforge.createSourcesJar=true || true
          echo "Jars found:"; find build .gradle -name '*.jar' 2>/dev/null | head -20

      - name: Print source files
        env:
          FILES: ${{ github.event.inputs.files }}
          PATTERN: ${{ github.event.inputs.grep }}
          JAVAP_FLAGS: ${{ github.event.inputs.javap_flags }}
        run: |
          # The decompiled Minecraft sources are the sources jar that contains net/minecraft/
          SOURCES=""
          for jar in $(find build .gradle ~/.gradle -name '*sources*.jar' 2>/dev/null); do
            if unzip -l "$jar" 2>/dev/null | grep -q 'net/minecraft/world/level/Level.java'; then
              SOURCES="$jar"
              break
            fi
          done
          echo "Sources jar: $SOURCES"
          # Without sources, fall back to javap on the compiled Minecraft classes (methods and fields only)
          CLASSES=""
          for jar in $(find build .gradle ~/.gradle -name '*.jar' 2>/dev/null); do
            if unzip -l "$jar" 2>/dev/null | grep -q 'net/minecraft/world/level/Level.class'; then
              CLASSES="$jar"
              break
            fi
          done
          echo "Classes jar: $CLASSES"
          # NeoForge's own classes (events, data providers) are in other jars: add them to the classpath
          CLASSPATH_ALL="$CLASSES"
          for jar in $(find build .gradle ~/.gradle -name '*.jar' -path '*neoforge*' 2>/dev/null); do
            CLASSPATH_ALL="$CLASSPATH_ALL:$jar"
          done
          for f in $FILES; do
            echo "===== $f ====="
            NOT_FOUND=""
            if [[ "$f" != *.java ]]; then
              # Not a class: a resource file (model, blockstate, item definition…) from the Minecraft jars
              OUT=""
              for jar in "$CLASSES" $(find build ~/.gradle -name '*.jar' -path '*minecraft*' 2>/dev/null); do
                if [[ "$f" == *.png ]]; then
                  # Images are binary: print them as base64 (decode with base64 -d)
                  OUT=$(unzip -p "$jar" "$f" 2>/dev/null | base64 -w0) && [ -n "$OUT" ] && break
                else
                  OUT=$(unzip -p "$jar" "$f" 2>/dev/null) && [ -n "$OUT" ] && break
                fi
              done
              [ -z "$OUT" ] && OUT="(resource not found)"
            elif [ -n "$SOURCES" ]; then
              OUT=$(unzip -p "$SOURCES" "$f" 2>/dev/null)
            else
              CLASS=$(echo "$f" | sed 's/\.java$//; s#/#.#g')
              if ! OUT=$(javap ${JAVAP_FLAGS:--p} -classpath "$CLASSPATH_ALL" "$CLASS" 2>&1); then
                # Not found (renamed or moved?): list classes with a similar name instead
                NAME=$(basename "$f" .java)
                SIMILAR=$(unzip -l "$CLASSES" | grep -o "net/minecraft/[^ ]*$NAME[^ ]*\.class" | head -20)
                OUT=$(printf '(class not found) Classes with %s in the name:\n%s' "$NAME" "$SIMILAR")
                NOT_FOUND=1
              fi
            fi
            if [ -n "$PATTERN" ] && [ -z "$NOT_FOUND" ]; then
              echo "$OUT" | grep -n -E "$PATTERN" || echo "(no matches)"
            else
              echo "$OUT"
            fi
          done
